
<section class="signup-page">

  <div class="signup-background"></div>

  <div class="signup-container">

    <div class="signup-card">

      <!-- Header -->

      <div class="signup-header">

        <span class="eyebrow">
          CINEBOOK
        </span>

        <h1>Create Account</h1>

        <p>
          Join CineBook and start booking your favorite movies.
        </p>

      </div>


      <!-- Error -->

      @if (errorMessage()) {

        <div class="message error-message">
          {{ errorMessage() }}
        </div>

      }


      <!-- Success -->

      @if (successMessage()) {

        <div class="message success-message">
          {{ successMessage() }}
        </div>

      }


      <!-- Signup Form -->

      <form (ngSubmit)="signup()">

        <!-- Name -->

        <div class="form-group">

          <label for="name">
            Full Name
          </label>

          <input
            id="name"
            type="text"
            name="name"
            [(ngModel)]="name"
            placeholder="Enter your full name"
            autocomplete="name"
          />

        </div>


        <!-- Email -->

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email"
          />

        </div>


        <!-- Phone -->

        <div class="form-group">

          <label for="phone">
            Phone
            <span>(Optional)</span>
          </label>

          <input
            id="phone"
            type="tel"
            name="phone"
            [(ngModel)]="phone"
            placeholder="Enter your phone number"
            autocomplete="tel"
          />

        </div>


        <!-- Password -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Create a password"
            autocomplete="new-password"
          />

        </div>


        <!-- Confirm Password -->

        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm your password"
            autocomplete="new-password"
          />

        </div>


        <!-- Submit -->

        <button
          class="signup-btn"
          type="submit"
          [disabled]="loading()"
        >

          @if (loading()) {

            <span class="spinner"></span>

            Creating Account...

          } @else {

            Create Account

            <span>→</span>

          }

        </button>

      </form>


      <!-- Login -->

      <div class="divider">
        <span>OR</span>
      </div>


      <p class="login-text">

        Already have an account?

        <a routerLink="/login">
          Sign In
        </a>

      </p>

    </div>

  </div>

</section>
